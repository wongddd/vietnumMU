[Text_InfoDW]
Text0 = "黑暗 wizard 介绍"
Text1 = "有些人试图拥有强壮的体魄"
Text2 = "他们利用自然规律为自己谋利。"
Text3 = "黑暗 wizard 可以使用魔法攻击敌人。"
Text4 = "此外，他还可以请求来自"
Text5 = "神秘灵魂的支援。人们都畏惧黑暗 wizard"
Text6 = "的魔法力量，因此他通常独来独往。"
Text7 = "然而他看似虚弱的外表可能会让你产生误解"
Text8 = "不要被欺骗。许多战士"
Text9 = "在触及黑暗 wizard 之前就被火焰吞噬了。"
Text10 = "黑暗 wizard 拥有专属的攻击魔法列表。"
Text11 = "尽管威力强大，但许多魔法需要"
Text12 = "时间来寻找并消耗大量能量来施展。"
[Text_InfoDK]
Text0 = "战士介绍"
Text1 = "战士是力量与权力的化身。
Text2 = "在激烈的战斗中，他们能在
Text3 = "重伤的情况下击杀其他角色。
Text4 = "凭借出色的生存能力，战士可以
Text5 = "独自冒险而不会遇到任何困难。
Text6 = "他可以穿戴各种不同类型的铠甲
Text7 = "使用不同类型的武器，如剑、锤或矛。
Text8 = "战士的技能消耗能量不多。
Text9 = "因此战士通常是新手玩家的首选。
Text10 = "此外，战士在骑乘"
Text11 = "战鹰时会获得特殊技能。"
[Text_InfoELF]
Text0 = "精灵介绍"
Text1 = "诺丽亚的精灵是古老种族的角色。"
Text2 = "他们认为自己是人类之前 MU 的第一个种族。"
Text3 = "诺丽亚的一位精灵传承着神秘的美丽。"
Text4 = "虽然她们似乎回避战斗，但不能说"
Text5 = "她们胆小。精灵们教会了人类"
Text6 = "精湛的弓箭技巧。没有人能在"
Text7 = "弓箭战中战胜精灵。"
Text8 = "诺丽亚的精灵与其他种族也有"
Text9 = "盟约，这些条约使他们卷入了战争。"
[Text_InfoMG]
Text0 = "格斗家介绍"
Text1 = "格斗家可以使用战士和黑暗 wizard 的一系列技能"
Text2 = "尽管战斗技能和魔法不如"
Text3 = "战士或黑暗 wizard 完美，但这种结合使他成为"
Text4 = "最具突破性的角色之一。"
Text5 = "格斗家能够施展决定性打击，"
Text6 = "他们可以使用强力装备或进入"
Text7 = "不同区域，等级要求低于其他角色。"
Text8 = "也与其他种族有盟约"
Text9 = "最后，要成为格斗家，你需要达到 220 级"
[Text_InfoDL]
Text0 = "领主介绍"
Text1 = "领主挥舞着剑，以领袖的威严"
Text2 = "指挥战斗。他们拥有召唤黑鹰和战马的力量"
Text3 = "来压制敌人。如同格斗家，他们可以进入"
Text4 = "不同区域并穿戴优质装备，"
Text5 = "要求低于其他角色。此外，"
Text6 = "他们拥有全新的魔法和"
Text7 = "MU 大陆前所未有的技术。最后，要成为领主，"
Text8 = "你需要达到 250 级。"
[Text_InfoSUM]
Text0 = "召唤术师介绍"
Text1 = "召唤术师诞生于 Elbeland，一个隐士村庄"
Text2 = "位于 MU 大陆的西南部。"
Text3 = "根据古老的传说，这里是拥有超凡能力"
Text4 = "之人的居住地，他们非常敏感，容易"
Text5 = "与未超度的灵魂沟通。由于其起源特点，"
Text6 = "召唤术师继承了祖先的所有魔法。"
Text7 = "此外，他们还拥有吸血和召唤"
Text8 = "灵魂的技能来辅助自己。被灵魂击中的对手"
Text9 = "将受到诅咒并损失大量生命值。"
[Text_InfoRF]
Text0 = "铁血战士介绍"
Text1 = "铁血战士（Rage Fighter）是皇家骑士团的后裔"
Text2 = "在 Kalrutan 王国，铁血战士成功"
Text3 = "运用以身体力量为优势的战斗策略。"
Text4 = "凭借敏捷的移动和出其不意的攻击，"
Text5 = "铁血战士总是让对手陷入被动"
Text6 = "措手不及，并用其庞大的身躯"
Text7 = "迅速击倒对手。此外，该角色还"
Text8 = "能够远程消灭敌人，"
Text9 = "凭借自身能量造成巨大伤害。"
