[Text_InfoDW]
Text0 = "黑暗巫师介绍"
Text1 = "有些人追求强壮的体魄,"
Text2 = "而他则研究自然法则来为自己谋利."
Text3 = "黑暗巫师可以使用魔法攻击敌人."
Text4 = "此外, 他还可以寻求来自"
Text5 = "神秘灵魂的帮助. 人们都惧怕他"
Text6 = "强大的魔法力量, 因此他通常独自生活. 然而"
Text7 = "他脆弱的外表可能会让你产生错误的判断,"
Text8 = "不要被迷惑. 许多战士"
Text9 = "在触及黑暗巫师之前就被火焰所吞噬"
Text10 = "黑暗巫师拥有独立的攻击魔法列表."
Text11 = "虽然强大, 但许多魔法需要"
Text12 = "时间来寻找, 并消耗大量能量来施展."
[Text_InfoDK]
Text0 = "战士介绍"
Text1 = "战士是力量与权力的化身.
Text2 = "在激烈的战斗中, 他们可以击杀
Text3 = "其他职业的角色, 即使自己身受重伤.
Text4 = "凭借出色的生存能力, 战士可以独自冒险
Text5 = "而不会遇到任何困难.
Text6 = "他可以穿戴不同类型的盔甲,
Text7 = "使用剑, 锤或矛等不同的武器.
Text8 = "战士的技能消耗能量不多.
Text9 = "因此战士通常是新手玩家的首选.
Text10 = "此外, 战士在骑乘
Text11 = "怪鸟时将获得特殊技能.
[Text_InfoELF]
Text0 = "精灵介绍"
Text1 = "诺丽亚的精灵属于古老的种族."
Text2 = "他们认为自己是 MU 大陆上早于人类的第一个种族."
Text3 = "诺丽亚的一位精灵相传拥有神秘的美丽."
Text4 = "虽然他们看似回避战斗, 但不能说"
Text5 = "他们胆小. 精灵们教会了人类"
Text6 = "精湛的弓箭技巧. 没有人能在弓箭对决中"
Text7 = "战胜精灵. 诺丽亚的精灵们"
Text8 = "也与其他种族有盟约,"
Text9 = "这些协议将他们卷入了战争."
[Text_InfoMG]
Text0 = "斗士介绍"
Text1 = "斗士可以使用战士和黑暗巫师的一系列技能."
Text2 = "虽然战斗技能和魔法不如"
Text3 = "战士或黑暗巫师那样完美, 但这种结合使他成为"
Text4 = "所有职业中最具突破性的角色."
Text5 = "斗士能够施展决定性的攻击,"
Text6 = "他们可以使用强大的装备或进入"
Text7 = "等级要求比其他职业低的区域."
Text8 = "也与其他种族有盟约,"
Text9 = "最后, 要创建斗士你需达到等级 220."
[Text_InfoDL]
Text0 = "领主介绍"
Text1 = "领主挥剑发令, 展现出领袖的威严"
Text2 = "在战斗中. 他们拥有召唤灵鸦和战马的力量,"
Text3 = "帮助他们压制敌人. 像斗士一样, 他们可以进入"
Text4 = "一些区域并穿戴"
Text5 = "比其他职业要求更低的装备. 此外,"
Text6 = "他们拥有前所未有的"
Text7 = "新魔法和技术. 最后, 要创建领主"
Text8 = "你必须达到等级 250."
[Text_InfoSUM]
Text0 = "召唤术师介绍"
Text1 = "召唤术师诞生于隐士之村 Elbeland,"
Text2 = "位于 MU 大陆的西南部."
Text3 = "根据古老的传说, 这里是拥有超自然能力的人"
Text4 = "居住的地方, 他们非常敏感, 能够轻易地"
Text5 = "与未超度的灵魂沟通. 正因为这一起源特点,"
Text6 = "召唤术师继承了祖先所有的魔法."
Text7 = "此外他们还拥有吸血和召唤灵魂的技能"
Text8 = "来辅助自己. 对手被灵魂击中后"
Text9 = "将中诅咒并损失大量生命值."
[Text_InfoRF]
Text0 = "铁血战士介绍"
Text1 = "铁血战士 (Rage Fighter) 是皇家骑士团的后裔,"
Text2 = "在卡尔鲁坦王国, 铁血战士成功"
Text3 = "运用以身体力量为优势的战术."
Text4 = "凭借敏捷的移动和出其不意的攻击,"
Text5 = "铁血战士总是让对手陷入被动"
Text6 = "措手不及, 并利用自己庞大的身躯"
Text7 = "快速击倒对手. 此外, 该角色也"
Text8 = "拥有远程消灭敌人的能力,"
Text9 = "凭借自身能量造成巨大伤害."
